name: Build Royal Bingo Payment Reader APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'payment-sms-android/**'
      - '.github/workflows/build-payment-reader.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Build APK
        run: gradle -p payment-sms-android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: royal-bingo-payment-reader-debug
          path: payment-sms-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
